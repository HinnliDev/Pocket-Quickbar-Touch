[mod-name]
pocket-quickbar-touch=Быстрая панель
[mod-description]
pocket-quickbar-touch=Постоянная панель быстрого доступа для Factorio при сенсорном управлении или использовании геймпада, в том числе в Pocket Foundry на Android.
[mod-setting-name]
pqt-rows=Число строк панели (по умолчанию)
pqt-size=Размер ячеек (по умолчанию)
pqt-only-controller=Показывать только при управлении геймпадом
[mod-setting-description]
pqt-rows=Начальное количество строк. Доступна настройка через кнопку «Настройки» на панели.
pqt-size=Начальный размер ячеек. Доступна настройка через кнопку «Настройки» на панели.
pqt-only-controller=Показывать панель только при управлении геймпадом, включая Pocket Foundry.
