name: Publish Quick Bar release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Publish v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "Release already exists"
            exit 0
          fi
          gh release create v0.1.0 dist/pocket-quickbar-touch_0.1.0.zip \
            --target "$GITHUB_SHA" \
            --title "Quick Bar v0.1.0" \
            --notes-file RELEASE_NOTES.md
